# profile.yml — Coding Agent Kit manifest (v2)
# Single source of truth: paths, skills, adapters.
# Superpowers: plan → TDD → implement → verify → report.
# YAGNI: delete weightless code.

version: "4.0.0"
name: coding-agent-kit
description: Coding Agent OS — superpowers, YAGNI, TDD, cross-chat memory, trap-suite evals.

core:
  ops:           OPS.md
  agents:        AGENTS.md
  runtime:       SKILL_RUNTIME.md

paths:
  # Memory root convention: env MEMORY_ROOT, else ~/.memory (shell-expanded).
  skills:        skills
  wiki:          ~/.memory/Wiki   # memory lives outside the kit
  db_tools:      ~/.memory/db-tools
  adapters:      adapters
  scripts:       scripts
  eval:          eval

memory:
  root: "~/.memory"                # env MEMORY_ROOT overrides
  engine: db-tools/search.py
  findings: db-tools/findings.py
  repomap: db-tools/repomap.py
  search_all: db-tools/search_all.py
  build:  db-tools/build.py
  lint:   db-tools/lint_wiki.py
  warmup: scripts/memory-warmup.py

skills:
  format: SKILL.md + frontmatter
  frontmatter_required: true
  required_keys: [name, description]
  language: English bodies, bilingual user-triggers
  always_on:
    - superpowers               # plan → TDD → implement → verify → report
    - yagni                     # minimalism, delete weightless code
    - engineering-persona       # direct engineering tone
    - fable-method              # complex tasks
    - dev-wiki                  # cross-chat memory
  domain:
    - code-review-and-quality
    - test-driven-development
    - incremental-implementation
    - architecture-simplicity
    - production-first-decisions
    - security-and-hardening
    - observability-and-instrumentation
    - shipping-and-launch
    - spec-driven-development
    - git-workflow-and-versioning
    - code-graph-review
    - money-path-safety
    - web-research
    - skill-authoring            # + session → SKILL.md (former /learn flow, §6)
    - reasoning-engine
    - testing-discipline
    - debug-incident-protocol
    - fable-judge
    - windows-encoding-fixes
    # obra/superpowers (MIT) — phase granularity
    - brainstorming
    - writing-plans
    - dispatching-parallel-agents
    - verification-before-completion
    - requesting-code-review
    - receiving-code-review
    - systematic-debugging
    - using-git-worktrees
    - finishing-a-development-branch
    - ponytail                   # lazy senior-dev mode (MIT; adapted from DietrichGebert/ponytail)
    # dashboard & ux design suite (2026-08-31: merged ui-review + data-viz into dashboard-design; agent-ux killed — 0 real uses)
    - dashboard-design           # dashboard design + honest data-viz + rendered UI review
    - design-system              # compact design tokens & shared components

adapters:
  - platform: gemini
    target: adapters/gemini.md
    canonical: false
  - platform: antigravity
    target: adapters/antigravity.md
    canonical: false
  - platform: zcode
    target: adapters/zcode.md
    canonical: false
  - platform: universal
    target: adapters/UNIVERSAL.md
    canonical: false

  # canonical: write/track the .agents/skills/ copy (deploy.py --canonical).
  # Default false — enable only for harnesses proven to read the alias.
  # gemini reads ~/.gemini/skills (junction to the kit master, always current).
eval:
  scenarios: eval/scenarios
  runner: eval/runner.py

integrity:
  watch:
    - OPS.md
    - AGENTS.md
    - profile.yml