# profile.yml — Coding Agent Kit manifest (v2)
# Single source of truth: paths, skills, adapters.
# Core method lives in OPS.md; skills load on demand for one open question.

version: "6.0.0"
name: coding-agent-kit
description: Coding Agent OS — one operating contract, 27 on-demand skills, cross-chat memory, trap-suite evals.

core:
  ops:           OPS.md
  agents:        AGENTS.md
  runtime:       SKILL_RUNTIME.md

paths:
  # Memory root convention: env MEMORY_ROOT, else ~/.memory (shell-expanded).
  skills:        skills
  wiki:          ~/.memory/Wiki   # memory lives outside the kit
  db_tools:      ~/.memory/db-tools
  adapters:      adapters
  scripts:       scripts
  eval:          eval

memory:
  root: "~/.memory"                # env MEMORY_ROOT overrides
  engine: db-tools/search.py
  findings: db-tools/findings.py
  repomap: db-tools/repomap.py
  search_all: db-tools/search_all.py
  build:  db-tools/build.py
  lint:   db-tools/lint_wiki.py
  warmup: scripts/memory-warmup.py

skills:
  format: SKILL.md + frontmatter
  frontmatter_required: true
  required_keys: [name, description]
  language: English bodies, bilingual user-triggers
  # Core principles live in OPS.md; skill bodies load only when needed.
  always_on: []
  domain:
    - fable-method
    - dev-wiki
    - code-review-and-quality       # performs and requests reviews
    - architecture-simplicity
    - production-first-decisions
    - security-and-hardening
    - observability-and-instrumentation
    - shipping-and-launch
    - git-workflow-and-versioning   # includes integrating a finished branch
    - code-graph-review
    - money-path-safety
    - web-research
    - skill-authoring               # includes turning a session into a skill
    - testing-discipline            # includes test-driven development
    - fable-judge
    - windows-encoding-fixes
    # derived from obra/superpowers (MIT; docs/licenses/superpowers-LICENSE)
    - brainstorming                 # includes spec-driven development
    - writing-plans                 # includes incremental implementation
    - dispatching-parallel-agents
    - verification-before-completion
    - receiving-code-review
    - systematic-debugging          # includes runtime incident protocol
    - using-git-worktrees
    - ponytail                      # minimal change + YAGNI (MIT; adapted from DietrichGebert/ponytail)
    - dashboard-design              # dashboard design + honest data-viz + rendered UI review
    - design-system                 # compact design tokens & shared components
    - autonomous-work               # opt-in autonomous work selection + supervisor

adapters:
  - platform: antigravity
    target: adapters/antigravity.md
    canonical: false
  - platform: hermes
    target: adapters/hermes.md
    canonical: false
  - platform: zcode
    target: adapters/zcode.md
    canonical: false
  - platform: universal
    target: adapters/UNIVERSAL.md
    canonical: false

  # canonical: write/track the .agents/skills/ copy (deploy.py --canonical).
  # Default false — enable only for harnesses proven to read the alias.

eval:
  scenarios: eval/scenarios
  runner: eval/runner.py

integrity:
  watch:
    - OPS.md
    - AGENTS.md
    - profile.yml