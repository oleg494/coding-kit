name: kit gates
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bootstrap memory (engine self-test)
        run: python scripts/install.py
      - name: Doctor (manifest, versions, frontmatter, db integrity)
        run: python scripts/doctor.py
      - name: File-size gate
        run: python scripts/tools/check_file_sizes.py --ci
      - name: Trap-suite (dry-run validation)
        run: python eval/runner.py
      - name: Task-runner (dry-run validation)
        run: python eval/task_runner.py --dry-run
      - name: Trigger queries validation
        run: python eval/trigger_eval.py --queries auto
      - name: Run tests
        run: python -m pytest tests -q
