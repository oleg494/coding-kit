name: kit gates
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest pyyaml
      - name: Bootstrap memory (engine self-test)
        run: python scripts/install.py
      - name: Doctor (manifest, versions, frontmatter, db integrity)
        run: python scripts/doctor.py
      - name: File-size gate
        run: python scripts/tools/check_file_sizes.py --ci
      - name: Trap-suite (dry-run validation)
        run: python eval/runner.py
      - name: Task-runner (dry-run validation)
        run: python eval/task_runner.py --dry-run
      - name: Trigger queries validation
        run: python eval/trigger_eval.py --queries auto
      - name: Session behavior case validation
        run: python eval/session_runner.py --cases eval/session_cases.json --validate
      - name: Run tests
        run: python -m pytest tests -q
