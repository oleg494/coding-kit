name: evals
permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"        # nightly 03:00 UTC
  workflow_dispatch:

jobs:
  evals:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bootstrap memory (engine self-test)
        run: python scripts/install.py
      - name: Run tests
        run: python -m pytest tests -q
      - name: File-size gate
        run: python scripts/tools/check_file_sizes.py --ci
      - name: Trap-suite (dry-run validation)
        run: python eval/runner.py --json eval/ci-results/trap.json
      - name: Task-runner (dry-run validation)
        run: python eval/task_runner.py --dry-run --json eval/ci-results/tasks.json
      - name: Trigger queries validation
        run: python eval/trigger_eval.py --queries eval/trigger_queries.json --json eval/ci-results/trigger.json
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.os }}
          path: eval/ci-results
          if-no-files-found: error
