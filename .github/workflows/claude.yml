name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# One run per issue/PR: a new @claude mention supersedes an in-flight one
# instead of stacking runners and burning proxy tokens in parallel.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Gate on the runner side too, not only in the action: an issue opened
    # without a mention has no comment body to match.
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # action.yml shadows job env inside its own step, so it re-reads these by
      # name and forwards them: ANTHROPIC_BASE_URL and ANTHROPIC_DEFAULT_*_MODEL.
      # Inline on purpose: an empty vars.ANTHROPIC_BASE_URL would silently point
      # the run at api.anthropic.com, which rejects the gateway key.
      ANTHROPIC_BASE_URL: https://mproxy.online
      # Background calls (titles, inline-comment triage) resolve the `haiku`
      # alias; the gateway serves no Anthropic model ids, so pin it explicitly.
      ANTHROPIC_DEFAULT_HAIKU_MODEL: qwen3.8-flash
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No Claude GitHub App is installed here, so the OIDC -> app-token
          # exchange against api.anthropic.com cannot be used. Pass the workflow
          # token instead; token.ts short-circuits on OVERRIDE_GITHUB_TOKEN.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The post-run inline-comment classifier calls the Anthropic API
          # directly and gets no ANTHROPIC_BASE_URL, so behind a gateway it can
          # only fail. Post comments as they are produced instead.
          classify_inline_comments: "false"
          claude_args: |
            --model qwen3.8-max-0902
            --max-turns 30
